<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Prototipe SANGU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&family=Saira+Stencil+One&display=swap">
<style>
:root{
  --bg:#EDEFF5; --surface:#FFFFFF; --surface-2:#F5F6FA; --ink:#141A2E; --ink-2:#464E6B; --muted:#6B7290;
  --line:#D8DCE7; --line-2:#BFC5D5;
  --accent:#34409E; --accent-2:#27307A; --accent-ink:#FFFFFF; --accent-soft:#E2E5F7;
  --steel-1:#F1F3F7; --steel-2:#D9DDE6; --steel-3:#A3AABB; --steel-4:#7D8497;
  --good:#1D7F46; --good-soft:#E1F2E8; --warn:#8F5F00; --warn-bar:#E3A21A; --warn-soft:#FBF0D6; --bad:#BF2F24; --bad-soft:#FBE3E0;
  --r-hijau:#1F8A4C; --r-kuning:#E0A500; --r-merah:#CC3328;
  --hijau-soft:#E3F3E9; --kuning-soft:#FBF1D2; --merah-soft:#FBE2DF;
  --nl-a:#1B6E36; --nl-a-ink:#FFFFFF; --nl-b:#7AB944; --nl-b-ink:#10240A; --nl-c:#F1C21B; --nl-c-ink:#2B2200; --nl-d:#D2392E; --nl-d-ink:#FFFFFF;
  --s1:#2a78d6; --s-ctx:#9AA0B3; --grid:#E3E6EE; --axis:#C3C8D5;
  --shadow:0 1px 2px rgba(20,26,46,.06),0 6px 20px rgba(20,26,46,.08);
  --font-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-stencil:'Saira Stencil One','Barlow Condensed','Arial Narrow',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1120; --surface:#161A2B; --surface-2:#1C2135; --ink:#ECEEF7; --ink-2:#B6BBD2; --muted:#8C93AD;
    --line:#2A304A; --line-2:#3C4463;
    --accent:#9BA6FF; --accent-2:#B8C0FF; --accent-ink:#0E1120; --accent-soft:#232A52;
    --steel-1:#2B3147; --steel-2:#20263A; --steel-3:#5E6784; --steel-4:#8A92AB;
    --good:#4CC27E; --good-soft:#15301F; --warn:#F0B84A; --warn-soft:#33280F; --bad:#FF7A6E; --bad-soft:#3A1916;
    --hijau-soft:#14301F; --kuning-soft:#33290C; --merah-soft:#3A1815;
    --s1:#3987e5; --s-ctx:#5E6580; --grid:#252B42; --axis:#3A4262;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1120; --surface:#161A2B; --surface-2:#1C2135; --ink:#ECEEF7; --ink-2:#B6BBD2; --muted:#8C93AD;
  --line:#2A304A; --line-2:#3C4463;
  --accent:#9BA6FF; --accent-2:#B8C0FF; --accent-ink:#0E1120; --accent-soft:#232A52;
  --steel-1:#2B3147; --steel-2:#20263A; --steel-3:#5E6784; --steel-4:#8A92AB;
  --good:#4CC27E; --good-soft:#15301F; --warn:#F0B84A; --warn-soft:#33280F; --bad:#FF7A6E; --bad-soft:#3A1916;
  --hijau-soft:#14301F; --kuning-soft:#33290C; --merah-soft:#3A1815;
  --s1:#3987e5; --s-ctx:#5E6580; --grid:#252B42; --axis:#3A4262;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 40px;-webkit-font-smoothing:antialiased}
.app{max-width:1180px;margin:0 auto}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:18px 14px}
.brand{display:flex;align-items:center;gap:14px;margin-right:auto;min-width:0}
.wordmark{font-family:var(--font-stencil);font-size:36px;letter-spacing:.05em;color:var(--accent);line-height:1}
.brand-sub{color:var(--ink-2);font-size:13.5px;max-width:30ch;line-height:1.3}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.sm button{padding:5px 10px;font-size:13px}
.proto{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);border:1px dashed var(--line-2);border-radius:6px;padding:3px 8px;white-space:nowrap}

/* thesis strip */
.strip{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.s-end{display:flex;flex-direction:column;gap:5px;min-width:0;align-items:flex-start}
.s-end.r{align-items:flex-end;text-align:right}
.s-lab{font-family:var(--font-cond);font-weight:600;letter-spacing:.07em;text-transform:uppercase;font-size:12.5px;color:var(--muted)}
.bridge{display:flex;align-items:center;gap:8px;min-width:0}
.b-seg{flex:1;height:4px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--line-2) 0 8px,transparent 8px 14px);transition:background .5s}
.b-knot{font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);text-align:center}
.strip.closed .b-seg{background:var(--good)}
.strip.closed .b-knot{background:var(--good-soft);border-color:transparent;color:var(--good)}
@media (max-width:720px){
  .strip{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"l r" "b b";row-gap:10px}
  .s-end.l{grid-area:l}.s-end.r{grid-area:r}.bridge{grid-area:b}
}

/* chips, dots, badges */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);max-width:100%;line-height:1.3}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.dot.hijau{background:var(--r-hijau)}.dot.kuning{background:var(--r-kuning)}.dot.merah{background:var(--r-merah)}.dot.none{background:var(--line-2)}
.nl{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;font-family:var(--font-cond);font-weight:700;font-size:16px;line-height:1;flex:none}
.nl-A{background:var(--nl-a);color:var(--nl-a-ink)}.nl-B{background:var(--nl-b);color:var(--nl-b-ink)}.nl-C{background:var(--nl-c);color:var(--nl-c-ink)}.nl-D{background:var(--nl-d);color:var(--nl-d-ink)}
.nl.prov{outline:2px dashed var(--muted);outline-offset:2px}
.pb{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pb.cocok{background:var(--good-soft);color:var(--good)}.pb.batasi{background:var(--warn-soft);color:var(--warn)}.pb.hindari{background:var(--bad-soft);color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;align-self:flex-start;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}

/* tabs */
.tabs{display:flex;gap:4px;margin-block:18px 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 14px 11px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:0;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;color:var(--ink-2)}
.tab small{font-family:var(--font-cond);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tab span{font-weight:600;font-size:15px}
.tab[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--ink)}
.tab[aria-selected="true"] small{color:var(--accent)}

/* layout */
.grid-2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.stack-v{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:900px){.grid-2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:480px){.card{padding:16px}}
.eyebrow{font-family:var(--font-cond);font-weight:600;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.sec-head{display:flex;flex-direction:column;gap:6px}
.sec-head h2{font-family:var(--font-cond);font-weight:700;font-size:28px;line-height:1.05}
.sec-head p{color:var(--ink-2);max-width:64ch}
.h{font-family:var(--font-cond);font-weight:700;font-size:21px;line-height:1.1}
.muted{color:var(--muted)}.small{font-size:13px}.mono{font-family:var(--font-mono)}
.grow{flex:1;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.note{font-size:12.5px;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;line-height:1.2;text-align:center}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:8px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* baca */
.personas{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.persona{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.persona b{display:flex;align-items:center;gap:7px;font-size:15px}
.persona span{font-size:12.5px;color:var(--muted)}
.persona[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.story{font-size:14px;color:var(--ink-2);border-left:3px solid var(--line-2);padding-left:12px}
.rform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:520px){.rform{grid-template-columns:minmax(0,1fr)}}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.flabel{font-size:13px;font-weight:600;color:var(--ink-2)}
.inp{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);overflow:hidden;min-width:0}
.inp input{border:0;background:transparent;padding:8px 10px;font-family:var(--font-mono);font-size:15px;width:100%;min-width:0;outline:none}
.inp .u{font-family:var(--font-mono);font-size:12px;color:var(--muted);padding-right:10px;white-space:nowrap}
.inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pair{display:flex;gap:6px;align-items:center}
.pair .inp{flex:1}
.ind{font-size:12.5px;display:flex;align-items:center;gap:6px;color:var(--ink-2);min-height:18px}
.consent{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:14px;cursor:pointer}
.consent input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.verdict{display:flex;gap:14px;align-items:center;padding:14px;border-radius:12px}
.verdict.hijau{background:var(--hijau-soft)}.verdict.kuning{background:var(--kuning-soft)}.verdict.merah{background:var(--merah-soft)}.verdict.none{background:var(--surface-2)}
.swatch{width:66px;height:62px;border-radius:12px;display:grid;place-items:center;flex:none;font-family:var(--font-cond);font-weight:700;font-size:14px;letter-spacing:.04em;color:#fff}
.swatch.hijau{background:var(--r-hijau)}.swatch.kuning{background:var(--r-kuning);color:#2B2200}.swatch.merah{background:var(--r-merah)}.swatch.none{background:var(--line-2);color:var(--ink)}
.verdict b{font-size:16px}
.verdict ul{margin:4px 0 0;padding-left:18px;font-size:13.5px;color:var(--ink-2)}
.blist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.brow{display:grid;grid-template-columns:72px minmax(0,1fr);gap:4px 14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.brow .k{font-family:var(--font-cond);font-weight:700;font-size:18px;line-height:1.2}
.brow .bv{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 12px;min-width:0}
.brow .v{font-family:var(--font-mono);font-size:15px;font-weight:600;white-space:nowrap}
.brow .d{font-family:var(--font-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.brow .why{grid-column:2;font-size:12.5px;line-height:1.45;color:var(--muted)}
.brow .why.t{color:var(--warn)}
.refer{border:1px solid var(--r-merah);background:var(--merah-soft);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.refer b{color:var(--bad)}
.code{font-family:var(--font-mono);font-size:20px;letter-spacing:.14em;font-weight:600}

/* temu */
.temu{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;align-items:start}
.temu-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.temu-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);min-width:0}
@media (max-width:900px){.temu{grid-template-columns:minmax(0,1fr)}.temu-side{position:static;order:-1}}
.scan{display:grid;grid-template-columns:164px minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:520px){.scan{grid-template-columns:minmax(0,1fr);justify-items:start}}
.qr{position:relative;width:164px;max-width:100%;aspect-ratio:1;background:#FFFFFF;border-radius:12px;padding:12px;border:1px solid var(--line)}
.qr svg{width:100%;height:100%;display:block}
.qr .tag{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-family:var(--font-cond);font-weight:700;font-size:12px;letter-spacing:.08em;padding:2px 8px;border-radius:5px;white-space:nowrap}
.laser{position:absolute;left:8px;right:8px;height:3px;background:#E0352B;box-shadow:0 0 10px #E0352B;top:12px;animation:laser .55s ease-in-out infinite alternate;border-radius:2px}
@keyframes laser{to{top:calc(100% - 15px)}}
.scan-col{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.table-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.recos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.reco{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2);min-width:0}
.reco h4{font-family:var(--font-cond);font-size:18px;font-weight:700}
.reco .why{font-size:12.5px;color:var(--muted);margin-top:-6px}
.reco ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.reco li{display:flex;gap:8px;align-items:center;min-width:0}
.reco li .nl{width:20px;height:20px;font-size:14px;border-radius:5px}
.reco .sum{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2);line-height:1.5}
.reco .btn{margin-top:auto}
.demand{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn)}
.compare{font-size:14px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);color:var(--ink)}
.legend-nl{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);align-items:center}
.legend-nl span{display:inline-flex;gap:6px;align-items:center}
.legend-nl .nl{width:20px;height:20px;font-size:14px}
.mgroups{display:flex;flex-direction:column;gap:14px}
.mgroup{display:flex;flex-direction:column;gap:6px}
.mgroup h4{font-family:var(--font-cond);font-weight:700;font-size:14px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;cursor:pointer}
.mitem:hover{border-color:var(--line-2);background:var(--surface-2)}
.mitem[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.mitem .nm{font-weight:600;font-size:14.5px;display:block}
.mitem .pr{font-size:12px;color:var(--muted);display:block}
.tray-card{gap:14px}
.tray-wrap svg{width:100%;height:auto;display:block}
.comp{cursor:pointer}
.comp:focus-visible{outline:none}
.comp:focus-visible .cbox{stroke:var(--accent);stroke-width:3.5}
.stamp-anim{transform-box:fill-box;transform-origin:center;animation:stamp .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stamp{from{transform:scale(1.5);opacity:0}to{transform:scale(1);opacity:1}}
.tverdict{font-size:14px;font-weight:600;padding:10px 12px;border-radius:10px}
.tverdict.good{background:var(--good-soft);color:var(--good)}.tverdict.bad{background:var(--bad-soft);color:var(--bad)}.tverdict.none{background:var(--surface-2);color:var(--muted);font-weight:500}
.meters{display:flex;flex-direction:column;gap:10px}
.meter{display:grid;grid-template-columns:56px minmax(0,1fr) 116px;gap:10px;align-items:center}
.meter .k{font-family:var(--font-cond);font-weight:700;font-size:16px}
.track{position:relative;height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:5px}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;transition:width .35s ease}
.fill.ok{background:var(--good)}.fill.mid{background:var(--warn-bar)}.fill.over{background:var(--bad)}
.lim{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);left:66.667%;border-radius:1px}
.meter .v{font-family:var(--font-mono);font-size:12px;color:var(--ink-2);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.meter .v b{color:var(--ink);font-weight:600}
.swap{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13.5px;padding:10px 12px;border:1px dashed var(--line-2);border-radius:10px}

/* riwayat */
.weeks{display:flex;flex-direction:column;gap:10px}
.wk{display:grid;grid-template-columns:70px repeat(5,minmax(0,1fr));gap:6px;align-items:stretch}
.wk .wl{font-family:var(--font-cond);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);align-self:center}
.day{border:1px solid var(--line);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;min-width:0;background:var(--surface)}

function recommend(b){
  const A=activeMenu();const by=k=>A.filter(x=>x.kat===k);
  const K=by('karbo'),L=by('lauk'),V=by('sayur'),F=[null].concat(by('buah')),D=[null].concat(by('minum'));
  const out=[];
  for(const k of K)for(const l of L)for(const v of V)for(const f of F)for(const d of D){
    const list=[k,l,v,f,d].filter(Boolean);const tot=sumOf(list);const u=useOf(tot,b);
    if(!okU(u))continue;
    const q=list.reduce((a,it)=>a+'ABCD'.indexOf(levelOf(it).L),0);
    out.push({tray:{karbo:k.id,lauk:l.id,sayur:v.id,buah:f?f.id:null,ekstra:null,minum:d?d.id:null},tot,u,mx:Math.max(u.na,u.g,u.l,u.e),q,pref:(f?0:8)+(d?0:5),lauk:l.id});
  }
  const sig=c=>JSON.stringify(c.tray);const used=new Set();const picks=[];
  const pick=(arr,title,why)=>{const c=arr.find(x=>!used.has(sig(x))&&!picks.some(p=>p.lauk===x.lauk))||arr.find(x=>!used.has(sig(x)));if(c){used.add(sig(c));picks.push(Object.assign({},c,{title,why}));}};
  pick(out.slice().sort((a,b)=>(a.mx+a.pref+a.q*2)-(b.mx+b.pref+b.q*2)),'Paling seimbang','Tidak ada zat gizi yang mepet batas');
  pick(out.slice().sort((a,b)=>(a.u.na+a.pref)-(b.u.na+b.pref)),'Paling ringan garam','Natrium terendah untuk rapor ini');
  pick(out.slice().sort((a,b)=>(b.tot.e-b.pref*12)-(a.tot.e-a.pref*12)),'Paling mengenyangkan','Energi terbesar yang masih muat');
  return {picks,total:out.length,laukUnik:new Set(out.map(o=>o.lauk)).size};
}
function oneSwap(t,b){
  const A=activeMenu();const c=[];
  for(const k of KOMP){
    const cur=t[k.id];if(!cur)continue;
    const alts=A.filter(x=>x.kat===k.id&&x.id!==cur).map(x=>x.id);
    if(['buah','ekstra','minum'].includes(k.id))alts.push(null);
    for(const a of alts){const nt=Object.assign({},t,{[k.id]:a});const u=useOf(sumOf(trayList(nt)),b);if(okU(u))c.push({k:k.id,from:cur,to:a,mx:Math.max(u.na,u.g,u.l,u.e)});}
  }
  c.sort((x,y)=>y.mx-x.mx);
  return c[0]||null;
}

function localEstimate(f){
  const base={karbo:{e:130,g:.5,na:5,l:.5},lauk:{e:180,g:1,na:250,l:8},sayur:{e:45,g:2,na:200,l:1.5},buah:{e:45,g:8,na:3,l:.2},ekstra:{e:250,g:2,na:500,l:10},minum:{e:0,g:0,na:2,l:0}}[f.kat]||{e:150,g:2,na:200,l:5};
  const k=(Number(f.gram)||100)/100;
  let e=base.e*k,g=base.g*k,na=base.na*k,l=base.l*k;
  const t=(f.nama+' '+f.bahan).toLowerCase();const hits=[];
  const add=(re,dx,lab)=>{if(re.test(t)){e+=dx.e||0;g+=dx.g||0;na+=dx.na||0;l+=dx.l||0;hits.push(lab);}};
  add(/goreng|minyak/,{l:7,e:65},'minyak');
  add(/santan/,{l:7,e:60},'santan');
  add(/kecap/,{na:220,g:4,e:15},'kecap');
  add(/gula|sirup|madu/,{g:7,e:28},'gula');
  add(/garam/,{na:260},'garam');
  add(/penyedap|msg|kaldu|micin/,{na:200},'penyedap');
  add(/terasi|sambal|petis/,{na:150},'terasi atau sambal');
  add(/tepung/,{e:40,l:2},'tepung');
  add(/keju|mentega|margarin/,{l:4,e:36},'mentega atau keju');
  if(/kukus|rebus|pepes|bening|panggang/.test(t)){l*=0.7;e*=0.9;hits.push('dimasak tanpa banyak minyak');}
  const est={e:Math.round(e),g:Math.round(g*10)/10,na:Math.round(na/5)*5,l:Math.round(l*10)/10};
  const campuran=String(f.bahan).split(/,|\n/).filter(s=>s.trim()).length>=5||/kuah|soto|sop|gulai|opor|kari|rawon/.test(t);
  const drv=levelOf(est).drv;
  return Object.assign(est,{src:'lokal',conf:'rendah',campuran,
    alasan:hits.length?'Terdeteksi '+hits.slice(0,4).join(', ')+'. Angka berasal dari rata-rata kompartemen, bukan dari resep rinci.':'Angka berasal dari rata-rata kompartemen.',
    saran:drv==='na'?'Kurangi garam dan penyedap sepertiga, perkuat rasa dengan rempah.':drv==='g'?'Kurangi gula tambahan separuhnya.':'Ganti santan kental dengan santan encer dan kurangi minyak.'});
}

function stability(x){const lo=levelOf(scaleIt(x,1-GALAT)).L,mid=levelOf(x).L,hi=levelOf(scaleIt(x,1+GALAT)).L;return {lo,mid,hi,stable:lo===hi};}

function aiPrompt(f,withPhoto){
  return `Anda ahli gizi di Indonesia yang menaksir kandungan gizi menu kantin pabrik.
Taksir kandungan gizi untuk SATU porsi hidangan berikut.
Nama menu: ${f.nama}
Sekat nampan: ${KB[f.kat].label}
Porsi: ${f.porsi} (sekitar ${f.gram} g atau ml)
Resep dan bahan: ${f.bahan}
${withPhoto?'Foto hidangan terlampir. Gunakan foto untuk memperkirakan ukuran porsi dan cara masak.':''}
Aturan:
- gula_g adalah gula total tanpa laktosa, dalam gram.
- natrium_mg mencakup garam, kecap, penyedap, terasi, dan bahan olahan, dalam miligram.
- lemak_g adalah lemak total dalam gram, termasuk minyak goreng yang terserap.
- Bila resep untuk banyak porsi, bagi sesuai ukuran satu porsi di atas.
- keyakinan bernilai "rendah", "sedang", atau "tinggi".
- hidangan_campuran bernilai true bila bahan bercampur atau berkuah sehingga porsi sulit ditaksir.
- alasan paling banyak 25 kata dalam bahasa Indonesia dan menyebut bahan penyumbang terbesar.
- saran_reformulasi paling banyak 20 kata dalam bahasa Indonesia, berisi satu perubahan resep yang paling menurunkan gula, garam, atau lemak.
Balas hanya dengan satu objek JSON seperti contoh ini:
{"energi_kkal": 250, "gula_g": 3, "natrium_mg": 540, "lemak_g": 11, "keyakinan": "sedang", "hidangan_campuran": false, "alasan": "Kecap dan garam menyumbang natrium terbesar.", "saran_reformulasi": "Kurangi kecap separuh dan tambah bawang putih."}`;
}
const AI_ERR={cancelled:'Taksiran dihentikan.',rate_limited:'Terlalu banyak permintaan. Coba lagi beberapa saat lagi.',invalid_json:'Jawaban AI tidak terbaca. Coba lagi atau perjelas bahan.',empty_completion:'AI tidak memberi jawaban. Perjelas resep lalu coba lagi.',image_rejected:'Foto tidak bisa dipakai. Coba foto JPG atau PNG lain.',refused:'AI menolak permintaan ini. Ubah deskripsi menu.',session_expired:'Sesi Claude berakhir. Masuk lagi, lalu coba ulang.',prompt_too_large:'Resep terlalu panjang. Ringkas daftar bahan.'};
async function runAI(){
  if(!sampleFn||T.aiBusy)return;
  const f=S.form;
  if(!String(f.nama).trim()||!String(f.bahan).trim()){T.aiMsg='Isi nama menu dan bahan dulu.';refreshAI();return;}
  aiCtl=new AbortController();T.aiBusy=true;T.aiMsg='';refreshAI();
  const usePhoto=!!(photoFile&&sampleImages);
  try{
    const opts={modelTier:'quick',signal:aiCtl.signal};
    if(usePhoto)opts.images=[photoFile];
    const r=await sampleFn.json(aiPrompt(f,usePhoto),opts);
    const num=v=>{const n=Number(v);return isFinite(n)&&n>=0?n:null;};
    const e=num(r&&r.energi_kkal),g=num(r&&r.gula_g),na=num(r&&r.natrium_mg),l=num(r&&r.lemak_g);
    if(e==null||g==null||na==null||l==null)throw {code:'invalid_json'};
    S.est={src:'ai',e:Math.round(e),g:Math.round(g*10)/10,na:Math.round(na),l:Math.round(l*10)/10,
      conf:['rendah','sedang','tinggi'].includes(r.keyakinan)?r.keyakinan:'sedang',campuran:!!r.hidangan_campuran,
      alasan:String(r.alasan||'').slice(0,240),saran:String(r.saran_reformulasi||'').slice(0,200),foto:usePhoto};
    toast('Taksiran AI selesai');
  }catch(err){
    const code=err&&err.code;
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){sampleFn=null;T.aiState='off';T.aiMsg='AI tidak diizinkan di tampilan ini. Pakai taksiran cepat tanpa AI.';}
    else if(code==='images_unavailable'){sampleImages=false;T.aiMsg='Tampilan ini tidak bisa mengirim foto. Coba lagi tanpa foto.';}
    else T.aiMsg=AI_ERR[code]||'Koneksi ke AI gagal. Coba lagi.';
  }finally{T.aiBusy=false;aiCtl=null;if(S.role==='kantin'&&S.tab.kantin==='nilai')renderView();save();}
}

function qrSVG(){
  let seed=20260925;const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  const N=25;let p='';
  const finder=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#151515"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#151515"/>`;
  const inF=(x,y)=>(x<8&&y<8)||(x>=N-8&&y<8)||(x<8&&y>=N-8);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(inF(x,y))continue;if(rnd()>0.52)p+=`M${x} ${y}h1v1h-1z`;}
  return `<svg viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges" aria-hidden="true"><rect width="${N}" height="${N}" fill="#fff"/><path d="${p}" fill="#151515"/>${finder(0,0)}${finder(N-7,0)}${finder(0,N-7)}</svg>`;
}

function wrapText(str,max){const w=String(str).split(' ');const out=[];let cur='';for(const x of w){if(cur&&(cur+' '+x).length>max){out.push(cur);cur=x;}else cur=(cur?cur+' ':'')+x;}if(cur)out.push(cur);return out.slice(0,3);}

  else if(!core)verdict=`<p class="tverdict none">Lengkapi ${['karbo','lauk','sayur'].filter(k=>!t[k]).map(k=>KB[k].label.toLowerCase()).join(', ')} untuk menilai nampan.</p>`;
  else if(fit)verdict=`<p class="tverdict good">✓ Sesuai rapor. Semua zat gizi di bawah jatah makan siang.</p>`;
  else{const over=NUT.filter(n=>u[n.k]>100).map(n=>`${n.label.toLowerCase()} ${fmt(u[n.k])}%`);verdict=`<p class="tverdict bad">✕ Melewati jatah ${over.join(', ')}.</p>`;}
  const meters=NUT.map(n=>{const p=u[n.k];const w=Math.min(p,150)/150*100;const cls=p>100?'over':p>80?'mid':'ok';
    const val=n.k==='na'?`<b>${fmt(tot.na)}</b>/${fmt(b.na)} mg`:n.k==='e'?`<b>${fmt(tot.e)}</b>/${fmt(b.e)} kkal`:`<b>${fmtV(tot[n.k])}</b>/${fmtV(b[n.k])} g`;
    return `<div class="meter"><span class="k">${n.label}</span><div class="track" role="img" aria-label="${n.label} ${fmt(p)} persen dari jatah"><div class="fill ${cls}" style="width:${w}%"></div><span class="lim" title="Batas 100%"></span></div><span class="v">${val}</span></div>`;}).join('');
  let swap='';
  if(core&&!fit){
    const sw=oneSwap(t,b);
    if(sw){const from=byId(sw.from),to=sw.to?byId(sw.to):null;
      swap=`<div class="swap"><span>${to?`Tukar <b>${esc(from.nama)}</b> dengan <b>${esc(to.nama)}</b>`:`Lepas <b>${esc(from.nama)}</b>`} agar sesuai rapor.</span><button type="button" class="btn sm" data-act="swap" data-k="${sw.k}" data-to="${sw.to||''}">Terapkan</button></div>`;}
    else swap=`<div class="swap"><span>Satu tukar belum cukup. Pakai salah satu nampan rekomendasi.</span></div>`;
  }
  const chip=taken?(S.today.fit?`<span class="chip good">Sudah diambil</span>`:`<span class="chip bad">Diambil, belum sesuai</span>`):(S.usedReco&&list.length?`<span class="chip">Dari rekomendasi</span>`:list.length?`<span class="chip">Susunan sendiri</span>`:'');
  return `<section class="card tray-card" id="tray-card" aria-live="polite">
    <div class="row between"><h3 class="h">Nampan ${S.consent?esc(S.rapor.nama||'saya'):'saya'}</h3>${chip}</div>
    <div class="tray-wrap">${traySVG(t,stamp)}</div>
    ${verdict}
    <div class="meters">${meters}</div>
    <p class="note">Garis hitam pada tiap batang adalah jatah makan siang${B.general?' umum':' dari rapor'}.</p>
    ${swap}
    <div class="row"><button type="button" class="btn primary" data-act="take" ${core?'':'disabled'}>${taken?'Ambil ulang':'Ambil nampan ini'}</button>
    ${list.length?'<button type="button" class="btn" data-act="tray-empty">Kosongkan</button>':''}
    ${S.scanned?'<button type="button" class="btn ghost" data-act="habit">Coba nampan kebiasaan lama</button>':''}</div>
    ${list.length?'<p class="note">Ketuk sekat nampan untuk mengosongkannya.</p>':''}
  </section>`;
}

/* ---------- Riwayat dan privasi ---------- */
function viewRiwayat(){

      <div class="stat"><span class="n">${fits.length}/${done.length}</span><span class="l">nampan sesuai rapor</span></div>
      <div class="stat"><span class="n">${mand.length}</span><span class="l">dipilih mandiri</span></div>
      <div class="stat"><span class="n">${fmt(w2)}%</span><span class="l">rata-rata garam minggu ini</span></div>
    </div>
    <p class="feedback">${fb}</p>
    ${S.today?'':'<div class="row"><button type="button" class="btn primary" data-act="goto" data-v="temu">Isi nampan hari ini</button></div>'}
  </section>
  <section class="card"><div class="sec-head"><span class="eyebrow">Privasi</span><h2>Siapa melihat apa</h2><p>Rapor diolah di ponsel. Kantin hanya menerima ringkasan kelompok, dan perusahaan tidak menerima apa pun.</p></div>
    <div class="who">
      <div class="who-row"><span class="k">Ponsel ini</span><span class="v">${S.consent?`<span class="mono">TD ${r.sis}/${r.dia} · GDS ${r.gds} · IMT ${fmtV(r.imt)} · LP ${r.lp} cm</span><br>Diolah menjadi profil batas gizi. Tidak dikirim keluar.`:'Tidak ada rapor tersimpan. Izin sudah dicabut.'}</span></div>
      <div class="who-row"><span class="k">Kantin</span><span class="v">Warna risiko dilebur ke ringkasan kelompok. Kelompok di bawah 20 orang tidak ditampilkan. Pilihan nampan tercatat per level Nutri-Level, tanpa nama.</span></div>
      <div class="who-row"><span class="k">Perusahaan</span><span class="v">Tidak menerima angka rapor, warna rapor, maupun pilihan nampan per orang.</span></div>

    <p class="note">Rancangan mengikuti UU Nomor 27 Tahun 2022 tentang Pelindungan Data Pribadi dengan ringkasan anonim minimal 20 orang.</p>
  </section></div>`;
}

function estBox(){
  const x=S.est;if(!x)return '<p class="muted">Hasil taksiran muncul di sini.</p>';

  const rows=[['na','Natrium','mg',DAILY.na],['g','Gula','g',DAILY.g],['l','Lemak','g',DAILY.l]].map(([k,lab,unit,dl])=>{

    return `<div class="range"><span class="lbl">${lab}</span><div class="rtrack" role="img" aria-label="${lab} ${fmtV(mid)} persen batas harian, rentang ${fmtV(lo)} sampai ${fmtV(hi)} persen">${zoneHtml}<span class="band" style="left:${pos(lo)}%;width:${Math.max(1,pos(hi)-pos(lo))}%"></span><span class="mid" style="left:${pos(mid)}%"></span></div><span class="val">${f(x[k])} ${unit} (${f(x[k]*(1-GALAT))}–${f(x[k]*(1+GALAT))})</span></div>`;}).join('');
  const ticks=`<div class="rscale"><span></span><div class="ticks">${[['A',5],['B',15],['C',27.5],['D',47.5]].map(([L,v])=>`<span style="left:${pos(v)}%;color:var(--ink-2)">${L}</span>`).join('')}</div><span class="sp2"></span></div>`;
  const review=!st.stable||x.conf==='rendah'||x.campuran;
  return `<div class="est"><div class="est-head">${nl(lv.L,true)}<div><b>Level ${lv.L} sementara · ${esc(S.form.nama)}</b><div class="small muted">${x.src==='ai'?'Taksiran AI'+(x.foto?' dengan foto':''):'Taksiran cepat tanpa AI'} · keyakinan ${esc(x.conf)}${x.campuran?' · hidangan campuran':''} · energi ${fmt(x.e)} kkal</div></div></div>
    <div class="ranges">${ticks}${rows}</div>
    <p class="note">Pita biru menunjukkan rentang galat ±38,3%. Garis tebal adalah nilai taksiran. Skala dalam persen batas harian.</p>
    <p class="stab ${st.stable?'good':'warn'}">${st.stable?`Label tetap ${st.mid} di seluruh rentang galat.`:`Label bisa bergeser dari ${st.lo} ke ${st.hi} di rentang galat. Wajib ditinjau ahli gizi sebelum tampil.`}${st.stable&&review?' Hidangan campuran atau keyakinan rendah tetap perlu ditinjau.':''}</p>
    ${x.alasan?`<p class="small"><b>Alasan.</b> ${esc(x.alasan)}</p>`:''}
    ${x.saran?`<p class="small"><b>Saran reformulasi.</b> ${esc(x.saran)}</p>`:''}
    <div class="row"><button type="button" class="btn primary" data-act="queue-add">Masukkan ke antrean validasi</button></div></div>`;
}

/* ---------- Dasbor ---------- */
function viewDasbor(){
  const I=rnsrInfo();const w=WF[S.wf];
  const pill=I.r>=1?'<span class="pill good">✓ Sesuai</span>':'<span class="pill bad">✕ Belum sesuai</span>';
  const opts=[];
  S.menu.filter(it=>isValid(it)&&!it.aktif&&'AB'.includes(levelOf(it).L)).slice(0,3).forEach(it=>{opts.push({type:'act',it,r2:((I.ab+1)/(I.n+1)*100)/I.L});});
  const PRI=['sayur-lodeh','es-teh','sambal','ayam-goreng','telur-balado','ayam-bakar','mendoan','rendang','es-jeruk'];
  const pri=id=>{const i=PRI.indexOf(id);return i<0?99:i;};
  activeMenu().filter(it=>'CD'.includes(levelOf(it).L)).map(it=>({it,nv:reformOf(it)})).filter(o=>'AB'.includes(levelOf(o.nv).L)).sort((a,b)=>pri(a.it.id)-pri(b.it.id)).slice(0,4).forEach(o=>{opts.push({type:'ref',it:o.it,nv:o.nv,r2:((I.ab+1)/I.n*100)/I.L});});
  const optHtml=opts.map(o=>{const L=levelOf(o.it).L;
    if(o.type==='act')return `<div class="opt"><div class="grow"><span class="t">Aktifkan ${esc(o.it.nama)} ${nl(L)}</span><span class="small muted">Sudah tervalidasi, belum tampil di meja saji</span></div><div class="opt-r"><span class="small mono">RNSR ${fmt(o.r2,2)}</span><button type="button" class="btn sm" data-act="activate" data-id="${o.it.id}">Aktifkan</button></div></div>`;
    return `<div class="opt"><div class="grow"><span class="t">Reformulasi ${esc(o.it.nama)} ${nl(L)}<span aria-hidden="true">→</span>${nl(levelOf(o.nv).L)}</span><span class="small muted">${esc(o.nv.how)}</span></div><div class="opt-r"><span class="small mono">RNSR ${fmt(o.r2,2)}</span><button type="button" class="btn sm" data-act="reform" data-id="${o.it.id}">Terapkan</button></div></div>`;}).join('');
  const tl=Math.min(Math.max(I.L,6),94),vl=Math.min(Math.max(I.pct,6),94);
  const bullet=`<div class="bullet" role="img" aria-label="Menu Level A sampai B ${fmtV(I.pct)} persen, target ${fmtV(I.L)} persen"><span class="bg"></span><span class="val" style="width:${I.pct}%"></span><span class="tgt" style="left:${I.L}%"></span>
    <span class="tl" style="left:${tl}%;transform:translateX(-50%)">Target ${fmtV(I.L)}% (${esc(I.top?I.top.label.toLowerCase():'-')})</span>
    <span class="vl" style="left:${vl}%;transform:translateX(-50%)">A–B ${fmtV(I.pct)}%</span><span class="ax" style="left:0">0%</span><span class="ax" style="right:0">100%</span></div>`;
  const stack=['A','B','C','D'].filter(L=>I.cnt[L]).map(L=>`<span class="sg nl-${L}" style="flex-grow:${I.cnt[L]}" title="Level ${L}: ${I.cnt[L]} menu">${I.cnt[L]/I.n>0.08?L+' '+I.cnt[L]:''}</span>`).join('');
  const topId=I.top&&I.top.id;
  const rbars=I.gs.map(g=>g.hidden?`<div class="rbar"><span>${esc(g.label)}</span><div class="trk hid" role="img" aria-label="Disembunyikan"></div><span class="rv muted">&lt; 20 orang</span></div>`
    :`<div class="rbar"><span>${esc(g.label)}</span><div class="trk" role="img" aria-label="${esc(g.label)} ${fmtV(g.pct)} persen"><i class="${g.id===topId?'top':''}" style="width:${g.pct}%"></i></div><span class="rv">${fmtV(g.pct)}%${g.n!=null?' · '+fmt(g.n):''}</span></div>`).join('');
  const need=w.total?Math.ceil(w.total*I.L/100):Math.ceil(I.L);
  const focus={ob:'Porsi nasi kecil dan lauk rendah lemak di depan antrean',ht:'Sayur dan lauk Level A–B untuk natrium',gd:'Minuman tanpa gula di dekat kasir'};

function trendSeries(){return {b:TREND.before,s:TREND.withS.concat([Math.round(liveToday()*10)/10])};}
function trendTable(){const d=trendSeries();return `<div class="tbl-wrap"><table><thead><tr><th>Hari</th><th class="num">Sebelum SANGU</th><th class="num">Dengan SANGU</th></tr></thead><tbody>${TREND.days.map((x,i)=>`<tr><td>${x}${i===4?' (hari ini)':''}</td><td class="num">${fmtV(d.b[i])}%</td><td class="num">${fmtV(d.s[i])}%</td></tr>`).join('')}</tbody></table></div>`;}
function drawTrend(){
  const box=$('#trend');if(!box)return;
  const W=Math.max(280,box.clientWidth||560),H=230,m={t:14,r:W<420?58:80,b:28,l:40};
  const d=trendSeries();const y0=20,y1=70,n=TREND.days.length;
  const x=i=>m.l+i*(W-m.l-m.r)/(n-1);const y=v=>m.t+(1-(v-y0)/(y1-y0))*(H-m.t-m.b);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" tabindex="0" role="img" aria-label="Persentase item Level A sampai B terjual per hari. Sebelum SANGU ${d.b.map(fmtV).join(', ')} persen. Dengan SANGU ${d.s.map(fmtV).join(', ')} persen.">`;
  for(let v=y0;v<=y1;v+=10){s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" style="stroke:${v===y0?'var(--axis)':'var(--grid)'};stroke-width:1"/><text x="${m.l-8}" y="${y(v)+4}" text-anchor="end" style="font-family:var(--font-mono);font-size:11px;fill:var(--muted)">${v}%</text>`;}
  TREND.days.forEach((dd,i)=>{s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" style="font-family:var(--font-body);font-size:12px;fill:var(--muted)">${dd}</text>`;});
  const path=arr=>arr.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  s+=`<path d="${path(d.b)}" style="fill:none;stroke:var(--s-ctx);stroke-width:2;stroke-linejoin:round"/>`;
  s+=`<path d="${path(d.s)}" style="fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round"/>`;
  d.b.forEach((v,i)=>{s+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" style="fill:var(--s-ctx);stroke:var(--surface);stroke-width:2"/>`;});
  d.s.forEach((v,i)=>{s+=`<circle cx="${x(i)}" cy="${y(v)}" r="${i===n-1?5.5:4}" style="fill:var(--s1);stroke:var(--surface);stroke-width:2"/>`;});
  let ya=y(d.s[n-1]),yb=y(d.b[n-1]);if(Math.abs(ya-yb)<16){const mid=(ya+yb)/2;ya=mid-9;yb=mid+9;}
  s+=`<text x="${x(n-1)+10}" y="${ya+4}" style="font-family:var(--font-body);font-size:12px;font-weight:700;fill:var(--ink)">${fmtV(d.s[n-1])}%</text>`;
  s+=`<text x="${x(n-1)+10}" y="${yb+4}" style="font-family:var(--font-body);font-size:12px;fill:var(--ink-2)">${fmtV(d.b[n-1])}%</text>`;
  s+=`<line id="xh" x1="0" x2="0" y1="${m.t}" y2="${H-m.b}" style="stroke:var(--line-2);stroke-width:1;opacity:0"/>`;
  s+=`<rect id="hit" x="${m.l-16}" y="0" width="${W-m.l-m.r+32}" height="${H}" style="fill:transparent"/></svg><div class="tt" id="tt" hidden></div>`;
  box.innerHTML=s;
  const svg=box.querySelector('svg'),tt=$('#tt'),xh=box.querySelector('#xh');
  const show=i=>{if(i==null){tt.hidden=true;xh.style.opacity=0;return;}
    xh.setAttribute('x1',x(i));xh.setAttribute('x2',x(i));xh.style.opacity=1;
    tt.innerHTML=`<b>${TREND.days[i]}${i===n-1?' (hari ini)':''}</b><div class="r"><span><i class="dot" style="background:var(--s1)"></i>Dengan SANGU</span><span class="mono">${fmtV(d.s[i])}%</span></div><div class="r"><span><i class="dot" style="background:var(--s-ctx)"></i>Sebelum</span><span class="mono">${fmtV(d.b[i])}%</span></div>`;
    tt.hidden=false;const sc=box.clientWidth/W;const px=x(i)*sc;const tw=tt.offsetWidth;
    tt.style.left=Math.max(0,Math.min(box.clientWidth-tw,px+12>box.clientWidth-tw?px-tw-12:px+12))+'px';tt.style.top=Math.max(0,Math.min(y(d.s[i]),y(d.b[i]))*sc-30)+'px';};
  const idxAt=ev=>{const r=svg.getBoundingClientRect();const px=(ev.clientX-r.left)/r.width*W;let best=0,bd=1e9;for(let i=0;i<n;i++){const dd=Math.abs(px-x(i));if(dd<bd){bd=dd;best=i;}}return best;};
  svg.addEventListener('pointermove',ev=>{T.hover=idxAt(ev);show(T.hover);});
  svg.addEventListener('pointerleave',()=>{T.hover=null;show(null);});
  svg.addEventListener('focus',()=>{T.hover=n-1;show(T.hover);});
  svg.addEventListener('blur',()=>{T.hover=null;show(null);});
  svg.addEventListener('keydown',ev=>{if(ev.key==='ArrowRight'||ev.key==='ArrowLeft'){ev.preventDefault();T.hover=Math.max(0,Math.min(n-1,(T.hover==null?n-1:T.hover)+(ev.key==='ArrowRight'?1:-1)));show(T.hover);}});
}

let toastT;

function rerender(){renderStrip();renderView();renderMbar();save();}
const A={
  role:el=>{S.role=el.dataset.v;render();},
  tab:el=>{S.tab[S.role]=el.dataset.v;render();$('#tabs').scrollIntoView({block:'nearest'});},
  goto:el=>{S.role='pekerja';S.tab.pekerja=el.dataset.v;render();window.scrollTo({top:0,behavior:REDUCED?'auto':'smooth'});},

    if(S.tab.pekerja==='baca'&&S.role==='pekerja'){const f=$('#view');['usia','sis','dia','gds','imt','lp'].forEach(k=>{const i=$('#r-'+k,f);if(i)i.value=S.rapor[k];});updateBaca();renderStrip();save();}else rerender();},

  'make-ref':()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const r=n=>Array.from({length:n},()=>c[Math.floor(Math.random()*c.length)]).join('');S.refCode='RJK-'+r(3)+'-'+r(3);rerender();toast('Kode rujukan dibuat');},
  'copy-ref':()=>{const code=S.refCode;if(!code)return;try{navigator.clipboard.writeText(code).then(()=>toast('Kode disalin'),()=>toast('Salin manual: '+code));}catch(e){toast('Salin manual: '+code);}},
  scan:()=>{if(T.scanning)return;T.scanning=true;renderView();setTimeout(()=>{T.scanning=false;S.scanned=true;rerender();toast('Meja Saji 2 terbaca. Menu dicocokkan dengan rapor.');},REDUCED?150:1300);},

  pick:el=>{const it=byId(el.dataset.id);if(!it)return;S.tray[it.kat]=S.tray[it.kat]===it.id?null:it.id;rerender();},

  habit:()=>{const t=emptyTray();for(const k in HABIT){const it=HABIT[k]&&byId(HABIT[k]);if(it&&it.aktif&&isValid(it))t[k]=it.id;}S.tray=t;S.usedReco=false;rerender();toast('Nampan kebiasaan lama dimuat');},

    const levels=list.map(it=>levelOf(it).L);levels.forEach(L=>{S.purch[L]++;});
    S.today={tray:Object.assign({},t),fit,m:fit&&!S.usedReco,na:Math.round(u.na),levels};
    T.stampAnim=fit;rerender();

  'queue-add':()=>{const x=S.est;if(!x)return;const f=S.form;const id='m'+Date.now().toString(36);

  edit:el=>{T.editing={id:el.dataset.id,mode:el.dataset.mode};renderView();const i=$('#ed-e');if(i)i.focus();},
  'edit-cancel':()=>{T.editing=null;renderView();},
  'edit-save':el=>{const it=byId(el.dataset.id);if(!it)return;const g=k=>{const v=parseFloat(String(($('#ed-'+k)||{}).value||'').replace(',','.'));return isFinite(v)&&v>=0?v:it[k];};

  activate:el=>{const it=byId(el.dataset.id);if(!it)return;const before=rnsrInfo().r;it.aktif=true;afterMenuChange(before,`${it.nama} tampil di meja saji`);},
  reform:el=>{const it=byId(el.dataset.id);if(!it)return;const before=rnsrInfo().r;const nv=reformOf(it);
    ['e','g','na','l'].forEach(k=>{if(nv[k]!=null)it[k]=nv[k];});it.reform=nv.how;it.status='ahli';
    afterMenuChange(before,`Resep baru ${it.nama} disetujui ahli gizi (simulasi). Uji lab dijadwalkan`);},
  table:()=>{T.table=!T.table;renderView();},
  reset:()=>{try{localStorage.removeItem(KEY);}catch(e){}S=defaultState();T.editing=null;T.table=false;photoFile=null;render();window.scrollTo({top:0});toast('Demo kembali ke kondisi awal');}
};
function afterMenuChange(before,msg){
  const I=rnsrInfo();rerender();renderTop();
  if(before<1&&I.r>=1)toast(`RNSR ${fmt(I.r,2)}. Menu kantin kini sesuai rapor ${WF[S.wf].nama}.`);
  else toast(`${msg}. RNSR ${fmt(I.r,2)}.`);
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f)f(el,e);});
document.addEventListener('keydown',e=>{const el=e.target.closest&&e.target.closest('[role="button"][data-act]');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();el.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.r){const v=parseFloat(String(t.value).replace(',','.'));if(isFinite(v)){S.rapor[t.dataset.r]=v;if(S.persona!=='custom'){S.persona='custom';}}updateBaca();renderStrip();save();}
  else if(t.dataset.f){S.form[t.dataset.f]=t.value;save();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='consent'){S.consent=t.checked;if(!S.consent)S.refCode=null;updateBaca();renderStrip();save();toast(S.consent?'Izin diberikan':'Izin dicabut. Meja saji memakai label seragam.');}
  else if(t.id==='wf'){S.wf=t.value;rerender();}
  else if(t.id==='f-kat'){S.form.kat=t.value;save();}
  else if(t.id==='f-foto'){photoFile=t.files&&t.files[0]||null;const n=$('#foto-name');if(n)n.textContent=photoFile?photoFile.name:'Foto membantu AI menaksir ukuran porsi.';}
  else if(t.dataset&&t.dataset.aktif){const it=byId(t.dataset.aktif);if(!it)return;const before=rnsrInfo().r;it.aktif=t.checked;afterMenuChange(before,`${it.nama} ${it.aktif?'tampil di':'ditarik dari'} meja saji`);}
});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.role==='kantin'&&S.tab.kantin==='dasbor'&&!T.table)drawTrend();},150);});

/* ---------- mulai ---------- */
(function initHash(){const h=(location.hash||'').replace('#','');
  if(['baca','temu','riwayat'].includes(h)){S.role='pekerja';S.tab.pekerja=h;}
  else if(['nilai','dasbor'].includes(h)){S.role='kantin';S.tab.kantin=h;}})();
renderAbout();render();
})();
</script>
</body></html>
